name: Deploy React Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexcent/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./nexcent

      - name: Build Project
        run: npm run build
        working-directory: ./nexcent

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./nexcent/dist

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
